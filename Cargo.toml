[package]
name = "wgpu"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.29"
wgpu = "0.19"
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
bytemuck = { version = "1.16", features = ["derive"] }  # Для буферов данных

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
