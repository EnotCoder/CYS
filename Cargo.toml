[package]
name = "wgpu"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30"
winit_input_helper = "0.17"
wgpu = "30"
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
bytemuck = { version = "1.22", features = ["derive"] }
image = "0.25"
specs = "0.18"
ab_glyph = "0.2"
dotenvy = "0.15"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
