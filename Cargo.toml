[package]
name = "wgpu"
version = "0.1.0"
edition = "2021"

[lib]
name = "cys"
path = "src/main/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wgpu"
path = "src/main/main.rs"

[dependencies]
winit = "0.30"
winit_input_helper = "0.17"
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1.22", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
specs = "0.18"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
rodio = "0.22.2"

# Только под Android: точка входа android-activity + упаковка ассетов в APK.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

# Только под Windows (кросс-компиляция с mingw): в mingw нет импорт-либы
# vulkan-1, поэтому отключаем Vulkan-бэкенд и используем Dx12 + WGSL.
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl"] }

# Иконка в .exe (только под Windows): winres компилирует res/app.ico в ресурс.
[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Настройки сборки APK (используются cargo-apk / cargo-ndk).
# Все игровые файлы лежат в assets/ и упаковываются в APK-assets.
[package.metadata.android]
assets = "assets"
resources = "res"
package = "com.cys.game"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

# Всегда горизонтальная ориентация на телефоне (android:screenOrientation)
[package.metadata.android.application.activity]
orientation = "landscape"

# Полноэкранный режим: прячем системную статус-панель (время/батарея) ещё до
# запуска android_main, как в обычных мобильных играх (android:theme).
# Иконка приложения берётся из res/mipmap-* (android:icon).
[package.metadata.android.application]
theme = "@android:style/Theme.NoTitleBar.Fullscreen"
icon = "@mipmap/ic_launcher"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34



