[package]
name = "wgpu"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.29"
wgpu = "29.0.3"
env_logger = "0.11"
log = "0.4"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }  # Для буферов данных

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
