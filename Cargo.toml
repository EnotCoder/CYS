[package]
name = "wgpu"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30"
winit_input_helper = "0.17"
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1.22", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
specs = "0.18"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
